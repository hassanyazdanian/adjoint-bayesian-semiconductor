# Conda environment of the paper's computations (Apple M4 Pro, macOS arm64), exported with
# `conda env export --no-builds` on 5 Nov 2026; some packages are specific to macOS arm64.
# The adjoint code that is imported is dolfin-adjoint/pyadjoint 2018.1.0 from the torch-fenics branch of
# barkm/pyadjoint, installed with pip over the conda-forge package dolfin-adjoint 2023.0.0 (package metadata
# reports 2023.0.0). The two pip packages from git are pinned to the commits that were installed.
# Creating an environment from this file has not been tested on another machine.
